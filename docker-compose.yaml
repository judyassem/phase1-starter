services:
  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-seed/mysql-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-seed/postgres-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  mongo:
    image: docker.io/library/mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./db-seed/mongo-seed.js:/docker-entrypoint-initdb.d/01-seed.js
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: docker.io/library/redis:7
    volumes:
      - redis_data:/data
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  catalog:
    build: 
      context: ./services/legacy-catalog-java
      dockerfile: Containerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER} 
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD} 
    networks:
      - eventhub-network
    depends_on:
      mysql:
        condition: service_healthy
  auth:
    build: 
      context: ./services/auth-service-node
      dockerfile: Containerfile
    environment:
      PORT: 8082
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - eventhub-network
    depends_on:
      postgres:
        condition: service_healthy
          
  booking:
    build: 
      context: ./services/booking-service-python
      dockerfile: Containerfile
    environment:
      PORT: 8083
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      AUTH_SERVICE_URL: http://auth:8082
      AI_INSIGHT_URL: http://ai-insight:8084
    networks:
      - eventhub-network
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      ai-insight:
        condition: service_started

  notification:
    build: 
      context: ./services/notification-worker-go
      dockerfile: Containerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE: bookings
    networks:
      - eventhub-network
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  ai-insight:
    build: 
      context: ./services/ai-insight-service-python
      dockerfile: Containerfile
    environment:
      PORT: 8084
    networks:
      - eventhub-network
  analytics:
    build: 
      context: ./services/analytics-service-python
      dockerfile: Containerfile
    environment:
      PORT: 8085
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CATALOG_SERVICE_URL: http://catalog:8081
      BOOKING_SERVICE_URL: http://booking:8083
    ports:
      - "8085:8085"
    networks:
      - eventhub-network
    depends_on:
      redis:
        condition: service_healthy
  gateway:
    build: 
      context: ./api-gateway
      dockerfile: Containerfile
    environment:
      PORT: 8080
      CATALOG_SERVICE_URL: http://catalog:8081
      AUTH_SERVICE_URL: http://auth:8082
      BOOKING_SERVICE_URL: http://booking:8083
      NOTIFICATION_SERVICE_URL: http://notification
      AI_INSIGHT_SERVICE_URL: http://ai-insight:8084
      ANALYTICS_SERVICE_URL: http://analytics:8085
    ports:
      - "8080:8080"
    networks:
      - eventhub-network
    depends_on:
      - catalog
      - auth
      - booking
      - notification
      - ai-insight
      - analytics
  frontend:
    build: 
      context: ./frontend
      dockerfile: Containerfile
    environment:
      PORT: 3000
      GATEWAY_SERVICE_URL: http://localhost:8080
    ports:
      - "3000:80"
    networks:
      - eventhub-network
    depends_on:
      - gateway

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:

networks:
  eventhub-network:
    driver: bridge
    